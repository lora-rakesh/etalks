{% load static %}

{% block content %}

<style>
/* Background */
body {
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Card Styling */
.unlock-card {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    padding: 30px;
    text-align: center;
    color: white;
    width: 400px;
    animation: fadeIn 0.7s ease-in-out;
}

/* Header */
.unlock-card h4 {
    font-weight: bold;
    margin-bottom: 20px;
    font-size: 1.6rem;
}

/* Text */
.unlock-card p {
    font-size: 1rem;
    margin-bottom: 15px;
}

/* Textarea */
.unlock-card textarea {
    width: 100%;
    border-radius: 12px;
    border: none;
    padding: 10px;
    font-size: 0.95rem;
    margin-bottom: 15px;
    resize: none;
    outline: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

/* Buttons */
.unlock-card .btn-primary {
    background: linear-gradient(45deg, #ff4b2b, #ff416c);
    border: none;
    border-radius: 50px;
    padding: 10px 25px;
    font-size: 1rem;
    transition: transform 0.2s, box-shadow 0.2s;
}

.unlock-card .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
}

.unlock-card .btn-link {
    color: #f1f1f1;
    text-decoration: none;
    font-size: 0.9rem;
    transition: color 0.3s;
}

.unlock-card .btn-link:hover {
    color: #ffd369;
}

/* Fade animation */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(-20px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>

<div class="unlock-card">
    <h4>🔒 Account Locked</h4>
    <p>Your account has been locked due to too many failed login attempts.</p>
    <p>Please provide a reason and send an unlock request.</p>

    <form method="post" action="{% url 'send_unlock_request' user.id %}">
        {% csrf_token %}
        
        <!-- Reason Field -->
        <textarea name="reason" rows="3" placeholder="Enter your reason..." required></textarea>

        <button type="submit" class="btn btn-primary w-100">Send Unlock Request</button>
    </form>

    <div class="mt-3">
        <a href="{% url 'index' %}" class="btn btn-link">⬅ Back to Login</a>
    </div>
</div>
{% endblock %}
