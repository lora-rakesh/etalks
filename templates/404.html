<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 - Page Not Found</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f2f6fc, #dce3f0); /* Soft professional gradient */
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 40px 30px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      animation: fadeInCard 1s ease forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    @keyframes fadeInCard {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .illustration {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .card h1 {
      font-size: 100px;
      margin-bottom: 10px;
      animation: redPulse 3s infinite;
      background: linear-gradient(45deg, #ff0000, #ff4d4d, #b30000);
      background-size: 300% 300%;
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    @keyframes redPulse {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    .card h2 {
      font-size: 28px;
      color: #2c3e50;
      margin-bottom: 10px;
    }

    .card p {
      font-size: 16px;
      color: #7f8c8d;
      margin-bottom: 30px;
    }

    .card a {
      text-decoration: none;
      padding: 14px 32px;
      font-weight: 600;
      font-size: 16px;
      border-radius: 30px;
      background: linear-gradient(to right, #6a11cb, #2575fc);
      color: white;
      border: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease-in-out;
      display: inline-block;
    }

    .card a:hover {
      background: linear-gradient(to right, #ff512f, #dd2476);
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    @media (max-width: 600px) {
      .card h1 {
        font-size: 70px;
      }

      .card h2 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="illustration">🚫</div>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>Sorry, the page you are looking for might have been removed,<br> had its name changed, or is temporarily unavailable.</p>
    <a href="/">⟵ Return to Home</a>
  </div>
</body>
</html>
