{% load static %}

{% block content %}
    {% if messages %}
        <div class="mt-2">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        </div>
    {% endif %}
<style>
    .success-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        background: #f8f9fa;
    }
    .success-card {
        max-width: 500px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        border: 2px solid #28a745;
        padding: 25px;
        text-align: center;
        transition: transform 0.3s ease;
    }
    .success-card:hover {
        transform: translateY(-5px);
    }
    .success-title {
        color: #28a745;
        font-size: 1.6rem;
        font-weight: bold;
    }
    .success-text {
        font-size: 1rem;
        color: #555;
        margin: 15px 0;
    }
    .btn-custom {
        background: #007bff;
        color: #fff;
        border-radius: 8px;
        padding: 10px 20px;
        text-decoration: none;
        transition: background 0.3s;
    }
    .btn-custom:hover {
        background: #0056b3;
    }
</style>

<div class="success-container">
    <div class="success-card">
        <h4 class="success-title">✅ Request Sent!</h4>
        <p class="success-text">
            Your unlock request has been sent successfully to HR.  
            <strong>If your request is accepted, you will receive an email notification.</strong>
        </p>
        <a href="{% url 'index' %}?company_id={{ user.company_id }}" class="btn-custom">
            Back to Login
        </a>
    </div>
</div>
{% endblock %}
