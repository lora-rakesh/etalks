{% extends "base.html" %}
{% block content %}
<div class="topbar">
  <input type="text" id="searchBox" placeholder="Search employee..." autocomplete="off" />
  <ul id="results" class="employee-list"></ul>
</div>

<div class="etalks-app">
  <div class="sidebar">
    <div class="sidebar-header">Recent Chats</div>
    <ul id="recentChats" class="recent-chats"></ul>
  </div>

  <div class="chat-area" id="chat" style="display:none;">
    <div class="chat-header">
      <span id="chatWith"></span>
      <div class="chat-actions">
        <button id="callAudio" title="Audio Call">📞</button>
        <button id="callVideo" title="Video Call">🎥</button>
      </div>
    </div>

    <div id="messages" class="chat-messages"></div>

    <div class="chat-input">
      <input type="text" id="msgBox" placeholder="Type a message..." autocomplete="off" />
      <button type="button" id="sendBtn">➤</button>
    </div>
  </div>
</div>

<div class="video-area" id="videoArea">
  <video id="localVideo" autoplay muted playsinline></video>
  <video id="remoteVideo" autoplay playsinline></video>
  <button id="hangUp" class="hangup-btn" style="display:none;" title="Hang Up">❌ Hang Up</button>
</div>

<style>
 /* Base styles */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: #f7f9fc;
  margin: 0;
}

.etalks-app {
  display: flex;
  height: 88vh;
  max-width: 1100px;
  margin: 30px auto;
  border: 1px solid #e0e0e0;
  border-radius: 14px;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 2px 20px rgba(0,0,0,0.07);
}

.sidebar {
  width: 320px;
  background: #f8fafd;
  display: flex;
  flex-direction: column;
  border-right: 1px solid #eee;
}

.sidebar-header {
  background: #6e8efb;
  color: white;
  padding: 21px 0 18px 0;
  font-weight: bold;
  font-size: 1.2rem;
  letter-spacing: 1px;
  text-align: center;
}

/* Sticky top search bar */
.topbar {
  position: sticky;
  top: 0;
  background: #f8fafd;
  padding: 12px 20px;
  border-bottom: 1px solid #ddd;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 1000;
}

.topbar input#searchBox {
  width: 320px;
  max-width: 90vw;
  padding: 11px 14px;
  font-size: 1rem;
  border-radius: 22px;
  border: 1px solid #b3bfea;
  outline: none;
  box-shadow: 0 2px 8px rgba(110, 142, 251, 0.2);
  transition: box-shadow 0.3s;
}

.topbar input#searchBox:focus {
  box-shadow: 0 2px 12px rgba(110, 142, 251, 0.5);
}

.employee-list {
  width: 320px;
  max-width: 90vw;
  margin-top: 6px;
  max-height: 200px;
  background: white;
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.08);
  overflow-y: auto;
  list-style: none;
  padding: 0;
  border: 1px solid #ddd;
  position: absolute; /* floats below search input */
  z-index: 1001;
}

.employee-list li {
  padding: 10px 18px;
  cursor: pointer;
  border-bottom: 1px solid #f0f2f5;
}

.employee-list li:last-child {
  border-bottom: none;
}

.employee-list li:hover {
  background: #e7eaff;
}

/* Rest of your existing CSS unchanged ... */

.sidebar-search {
  padding: 15px;
}

.sidebar-search input {
  width: 100%;
  font-size: 1rem;
  padding: 11px;
  margin-top: 12px;
  border-radius: 22px;
  border: 1px solid #d1d9e6;
}
.employee-list, .recent-chats {
  flex: 1;
  overflow-y: auto;
  list-style: none;
  padding: 0;
  margin: 0;
  background: #f5f8fc;
}
.employee-list li, .recent-chats li {
  padding: 13px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 15px;
  border-bottom: 1px solid #eef1f5;
  cursor: pointer;
}
.employee-list li:hover, .recent-chats li:hover {
  background: #e7eaff;
}
.chat-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #eef3fa;
  min-width: 0;
}
.chat-header {
  background: #6e8efb;
  color: white;
  padding: 15px 23px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 1.05rem;
}
.chat-actions button {
  margin-left: 10px;
  background: #fff;
  color: #6e8efb;
  border: none;
  font-size: 1.2em;
  box-shadow: 0 1px 2px #eaeaea;
  border-radius: 50%;
  padding: 6px 12px;
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
}
.chat-actions button:hover {
  background: #e1e6f9;
  color: #485a99;
}
.chat-messages {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
  background: #f9fafe;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.message {
  display: flex;
  flex-direction: row;
  align-items: flex-end;
  margin-bottom: 2px;
}
.message.me {
  justify-content: flex-end;
}
.message.them {
  justify-content: flex-start;
}
.bubble {
  max-width: 72%;
  padding: 10px 15px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.45;
  box-shadow: 0 2px 6px rgba(110,142,251,0.07);
  word-break: break-word;
  position: relative;
}
.message.me .bubble {
  background: linear-gradient(135deg, #6e8efb 30%, #a777e3 100%);
  color: white;
  border-bottom-right-radius: 5px;
}
.message.them .bubble {
  background: #e6eaf0;
  color: #222;
  border-bottom-left-radius: 5px;
}
.sender {
  display: block;
  font-size: 11px;
  opacity: 0.65;
  margin-bottom: 1px;
  font-weight: 500;
}
.chat-input {
  display: flex;
  padding: 12px 18px;
  background: #f3f6fb;
  border-top: 1px solid #e6ecf3;
}
.chat-input input {
  flex: 1;
  height: 40px;
  padding: 0 13px;
  border: 1.5px solid #b3bfea;
  border-radius: 20px;
  outline: none;
  font-size: 1rem;
  background: #fff;
}
.chat-input button {
  margin-left: 10px;
  border: none;
  background: #6e8efb;
  color: white;
  border-radius: 50%;
  width: 42px;
  height: 42px;
  cursor: pointer;
  font-size: 21px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.unread-count {
  background: #ff4d5e;
  color: white;
  font-size: 12px;
  padding: 3px 8px;
  border-radius: 16px;
  margin-left: 7px;
  font-weight: bold;
}
.video-area {
  margin-top: 13px;
  display: flex;
  justify-content: center;
  gap: 16px;
  position: relative;
}
#localVideo, #remoteVideo {
  width: 230px;
  height: 170px;
  background: #000;
  border-radius: 10px;
  display: none;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.video-area.fullscreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 4000;
}
.video-area.fullscreen #localVideo,
.video-area.fullscreen #remoteVideo {
  width: 45vw;
  height: auto;
}
.video-area.fullscreen #localVideo {
  position: absolute;
  bottom: 25px;
  right: 25px;
  width: 230px;
  height: 170px;
  border: 1.5px solid #fff;
}
.hangup-btn {
  position: absolute;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  background: #ff4d5e;
  color: white;
  border: none;
  padding: 13px 19px;
  border-radius: 28px;
  cursor: pointer;
  font-size: 17px;
  z-index: 4100;
  box-shadow: 0 2px 6px rgba(255,77,94,0.22);
}
@media (max-width: 740px) {
  .etalks-app { flex-direction: column; height: auto; box-shadow: none; }
  .sidebar { width: 100%; min-height: unset; border-right: none; border-bottom: 1px solid #eee; }
  .chat-area { min-width: 0; min-height: 240px; }
}
@media (max-width: 500px) {
  .video-area.fullscreen #localVideo,
  .video-area.fullscreen #remoteVideo {
    width: 96vw;
    height: auto;
  }
  .video-area.fullscreen #localVideo { width: 40vw; height: 26vw; }
}

</style>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
const socket = io("http://127.0.0.1:8000", {
  path: "/ws/socket.io/",
  transports: ["websocket"]
});

const me = {{ me|safe }};
let currentRoom = null;
const employeeMap = {};
employeeMap[me.employee_id] = me.name;
const unreadCounts = {};
const recentChatsUl = document.getElementById("recentChats");

function makeRoomName(user1, user2) {
  return [user1, user2].sort().join(':');
}

socket.on("connect", () => {
  console.log("✅ Socket.IO connected");
  socket.emit("register", { employee_id: me.employee_id });
});
socket.on("connect_error", (error) => {
  console.error("❌ Socket.IO connection error:", error);
});
socket.on("disconnect", (reason) => {
  console.log("⚠️ Socket.IO disconnected:", reason);
});
socket.on("receive_message", (data) => {
  const isMe = data.from === me.employee_id;
  const isCurrentRoom = data.room === currentRoom;
  if (isCurrentRoom) {
    const senderName = isMe ? "Me" : (employeeMap[data.from] || data.from);
    addMessage(senderName, data.text, isMe);
  } else if (!isMe) {
    unreadCounts[data.from] = (unreadCounts[data.from] || 0) + 1;
    updateRecentChatsSidebar({
      employee_id: data.from,
      name: employeeMap[data.from] || data.from,
      last_text: data.text
    });
  }
});

document.getElementById("searchBox").addEventListener("input", async function() {
  const q = this.value.trim();
  const resultsList = document.getElementById("results");
  resultsList.innerHTML = "";
  if (q.length === 0) return;
  try {
    const resp = await fetch(`/etalks/employee_search/?q=${encodeURIComponent(q)}`);
    const data = await resp.json();
    data.results.forEach(emp => {
      const li = document.createElement("li");
      li.innerText = emp.name;
      li.onclick = () => {
        openChat(emp);
        resultsList.innerHTML = "";
        document.getElementById("searchBox").value = "";
      };
      resultsList.appendChild(li);
      employeeMap[emp.employee_id] = emp.name;
    });
  } catch (err) {
    console.error("Employee search failed", err);
  }
});

async function openChat(emp) {
  currentRoom = makeRoomName(me.employee_id, emp.employee_id);
  socket.emit("join_room", { room: currentRoom });
  document.getElementById("chatWith").innerText = emp.name;
  document.getElementById("chat").style.display = "flex";
  const messagesDiv = document.getElementById("messages");
  messagesDiv.innerHTML = "";
  try {
    const res = await fetch(`/etalks/messages/?room=${encodeURIComponent(currentRoom)}`);
    const data = await res.json();
    data.messages.forEach(msg => {
      const senderName = msg.sender_id === me.employee_id ? "Me" : (employeeMap[msg.sender_id] || msg.sender_id);
      addMessage(senderName, msg.text, msg.sender_id === me.employee_id);
    });
  } catch (error) {
    console.error("❌ Failed to load messages:", error);
  }
  unreadCounts[emp.employee_id] = 0;
  updateRecentChatsBadge(emp.employee_id);
}

document.getElementById("sendBtn").onclick = () => {
  const msgBox = document.getElementById("msgBox");
  const text = msgBox.value.trim();
  if (!text || !currentRoom) return;
  addMessage("Me", text, true);
  socket.emit("send_message", { room: currentRoom, from: me.employee_id, text });
  msgBox.value = "";
};

document.getElementById("msgBox").addEventListener("keypress", function(e) {
  if (e.key === "Enter") document.getElementById("sendBtn").click();
});

function addMessage(sender, text, isMe) {
  const div = document.createElement("div");
  div.classList.add("message", isMe ? "me" : "them");
  div.innerHTML = `
    <div class="bubble">
      <span class="sender">${sender}</span>
      <p>${text}</p>
    </div>
  `;
  const messagesDiv = document.getElementById("messages");
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function updateRecentChatsSidebar(chat) {
  const liId = `chat-${chat.employee_id}`;
  let li = document.getElementById(liId);
  let lastText = chat.last_text || "";
  if (lastText.length > 25) lastText = lastText.slice(0, 25) + '...';
  if (!li) {
    li = document.createElement("li");
    li.id = liId;
    li.dataset.emp = chat.employee_id;
    li.onclick = () => {
      openChat({ employee_id: chat.employee_id, name: chat.name });
      unreadCounts[chat.employee_id] = 0;
      updateRecentChatsBadge(chat.employee_id);
    };
    recentChatsUl.appendChild(li);
  }
  li.innerHTML = `<span class="chat-info">${chat.name}: ${lastText}</span>
                  <span class="unread-count">${unreadCounts[chat.employee_id] || ""}</span>`;
}

function updateRecentChatsBadge(employee_id) {
  const li = document.querySelector(`#chat-${employee_id} .unread-count`);
  if (li) li.innerText = unreadCounts[employee_id] || "";
}

async function loadRecentChats() {
  try {
    const res = await fetch("/etalks/recent_chats/");
    const data = await res.json();
    recentChatsUl.innerHTML = "";
    data.recent.forEach(chat => {
      unreadCounts[chat.employee_id] = 0;
      employeeMap[chat.employee_id] = chat.name;
      updateRecentChatsSidebar(chat);
    });
  } catch (error) {
    console.error("❌ Failed to load recent chats:", error);
  }
}
loadRecentChats();

// -- CALLS & VIDEO CALLS --
document.getElementById("callAudio").onclick = () => startCall("audio");
document.getElementById("callVideo").onclick = () => startCall("video");
document.getElementById("hangUp").onclick = () => {
  endCall();
  socket.emit("end_call", { to: currentRoom });
};

let peerConnection = null;
let localStream = null;

async function startCall(type) {
  endCall();
  peerConnection = new RTCPeerConnection();
  peerConnection.onicecandidate = ({ candidate }) => {
    if (candidate) socket.emit("webrtc_ice_candidate", { to: currentRoom, candidate });
  };
  peerConnection.ontrack = (e) => {
    const remote = document.getElementById("remoteVideo");
    remote.srcObject = e.streams[0];
    remote.style.display = "block";
  };
  localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: type === "video" });
  localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
  const local = document.getElementById("localVideo");
  local.srcObject = localStream;
  local.style.display = "block";
  document.getElementById("hangUp").style.display = "inline-block";
  document.getElementById("videoArea").classList.add("fullscreen");
  const offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);
  socket.emit("webrtc_offer", { to: currentRoom, offer });
}

function endCall() {
  if (peerConnection) peerConnection.close();
  if (localStream) localStream.getTracks().forEach(track => track.stop());
  const local = document.getElementById("localVideo");
  const remote = document.getElementById("remoteVideo");
  local.srcObject = null;
  remote.srcObject = null;
  local.style.display = "none";
  remote.style.display = "none";
  document.getElementById("hangUp").style.display = "none";
  document.getElementById("videoArea").classList.remove("fullscreen");
  peerConnection = null;
  localStream = null;
}

socket.on("webrtc_offer", async (data) => {
  endCall();
  peerConnection = new RTCPeerConnection();
  peerConnection.onicecandidate = ({ candidate }) => {
    if (candidate) socket.emit("webrtc_ice_candidate", { to: currentRoom, candidate });
  };
  peerConnection.ontrack = (e) => {
    const remote = document.getElementById("remoteVideo");
    remote.srcObject = e.streams[0];
    remote.style.display = "block";
  };
  localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
  localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
  const local = document.getElementById("localVideo");
  local.srcObject = localStream;
  local.style.display = "block";
  await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
  const answer = await peerConnection.createAnswer();
  await peerConnection.setLocalDescription(answer);
  socket.emit("webrtc_answer", { to: currentRoom, answer });
  document.getElementById("hangUp").style.display = "inline-block";
  document.getElementById("videoArea").classList.add("fullscreen");
});

socket.on("webrtc_answer", async (data) => {
  if (peerConnection) await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
});

socket.on("webrtc_ice_candidate", (data) => {
  if (peerConnection && data.candidate) peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
});

socket.on("end_call", endCall);
</script>

{% endblock %}
