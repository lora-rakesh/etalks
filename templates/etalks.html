<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <title>eTalks</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="{% static 'css/etalks.css' %}">
</head>
<body class="light-theme">
  <script>
    // Pass the current user ID to JS
    const CURRENT_USER_ID = {{ request.user.id }};
  </script>

  <div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar-wrapper">
      <div class="sidebar">
        <div class="sidebar-header">
          <h2 class="sidebar-title">eTalks</h2>
          <button class="theme-icon-btn" id="theme-toggle"><i class="fa fa-moon"></i></button>
        </div>
        <input type="text" id="search-input" placeholder="Search users...">
        <div class="sidebar-users" id="users-list"></div>
      </div>
    </div>

    <!-- Chat Window -->
    <div class="chat-wrapper">
      <div class="chat-window-container">
        <div class="chat-header">
          <div class="header-left">
            <div class="chat-avatar" id="chat-username-avatar">M</div>
            <span class="chat-name" id="chat-username">Select User</span>
          </div>
          <div class="header-right">
            <span class="call-icon" id="audio-call"><i class="fa fa-phone"></i></span>
            <span class="video-icon" id="video-call"><i class="fa fa-video"></i></span>
            <div class="msg-menu" id="menu-toggle">⋮
              <div id="dropdown" class="dropdown-options" style="display:none;">
                <div id="clear-chat">Clear Chat</div>
              </div>
            </div>
          </div>
        </div>

        <div class="chat-body" id="chat-body"></div>

        <div class="chat-input-box">
          <input type="text" id="chat-input" placeholder="Type a message...">
          <button id="send-btn"><i class="fa fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Call Modal -->
  <div id="call-modal" class="call-modal hidden">
    <div class="call-header">
      <span id="call-type">Video Call</span>
      <button id="end-call"><i class="fa fa-phone-slash"></i></button>
    </div>
    <div class="call-body">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
  </div>
   
  <script src="https://cdn.socket.io/4.7.1/socket.io.min.js"></script>
  <script src="{% static 'etalks.js' %}"></script>
</body>
</html>
