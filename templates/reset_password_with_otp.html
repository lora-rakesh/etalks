<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password with OTP</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg,rgb(83, 158, 244) 0%,rgb(234, 235, 234) 100%);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background-color: white;
      padding: 30px 40px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 1.8em;
      color: #333;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      font-weight: bold;
      margin-bottom: 6px;
      display: block;
      color: #333;
    }

    .form-control {
      width: 100%;
      padding: 10px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }

    .password-input-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #666;
    }

    .password-strength {
      margin-top: 8px;
      height: 8px;
      background-color: #eee;
      border-radius: 4px;
      overflow: hidden;
    }

    .strength-meter {
      height: 100%;
      width: 0%;
      background-color: #ccc;
      transition: width 0.3s ease;
    }

    .strength-text {
      margin-top: 6px;
      font-size: 0.9em;
      font-weight: bold;
      color: #555;
    }

    .password-requirements {
      margin-top: 12px;
      font-size: 0.9em;
    }

    .requirement {
      display: flex;
      align-items: center;
      color: #777;
      margin-bottom: 5px;
    }

    .requirement.valid {
      color: #38a169;
    }

    .requirement i {
      margin-right: 6px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #0191B4;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #017A98;
    }

    .alert {
      margin-top: 20px;
      padding: 12px;
      border-radius: 5px;
      background-color: #fcebea;
      color: #cc1f1a;
      font-size: 0.95em;
      text-align: center;
    }

    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Reset Password</h2>
    <form method="POST" id="resetForm" novalidate>
      {% csrf_token %}

      <div class="form-group">
        <label for="new_password">New Password</label>
        <div class="password-input-wrapper">
          <input type="password" id="new_password" name="new_password" class="form-control" required autocomplete="new-password" aria-describedby="passwordHelp" />
          <i class="toggle-password fas fa-eye" title="Show/Hide Password" tabindex="0"></i>
        </div>
        <div class="password-strength">
          <div class="strength-meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        </div>
        <div class="strength-text" id="passwordHelp"></div>

        <div class="password-requirements">
          <div class="requirement" data-requirement="length"><i class="fas fa-circle"></i> At least 8 characters</div>
          <div class="requirement" data-requirement="uppercase"><i class="fas fa-circle"></i> One uppercase letter</div>
          <div class="requirement" data-requirement="lowercase"><i class="fas fa-circle"></i> One lowercase letter</div>
          <div class="requirement" data-requirement="number"><i class="fas fa-circle"></i> One number</div>
          <div class="requirement" data-requirement="special"><i class="fas fa-circle"></i> One special character</div>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <div class="password-input-wrapper">
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" required autocomplete="new-password" />
          <i class="toggle-password fas fa-eye" title="Show/Hide Password" tabindex="0"></i>
        </div>
      </div>

      <button type="submit" class="btn"><i class="fas fa-lock"></i> Reset Password</button>
    </form>

    {% if messages %}
    <div class="alert">
      {% for message in messages %}
        <p>{{ message }}</p>
      {% endfor %}
    </div>
    {% endif %}
  </div>

  <script>
    // Show/hide password
    document.querySelectorAll('.toggle-password').forEach(icon => {
      icon.addEventListener('click', function () {
        const input = this.previousElementSibling;
        input.type = input.type === 'password' ? 'text' : 'password';
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
      });
    });

    // Password strength
    const newPassword = document.getElementById('new_password');
    const confirmPassword = document.getElementById('confirm_password');
    const strengthMeter = document.querySelector('.strength-meter');
    const strengthText = document.querySelector('.strength-text');
    const requirements = document.querySelectorAll('.requirement');

    function checkPasswordStrength(password) {
      let strength = 0;
      const checks = {
        length: password.length >= 8,
        uppercase: /[A-Z]/.test(password),
        lowercase: /[a-z]/.test(password),
        number: /[0-9]/.test(password),
        special: /[^A-Za-z0-9]/.test(password)
      };

      requirements.forEach(req => {
        const requirement = req.dataset.requirement;
        if (checks[requirement]) {
          req.classList.add('valid');
          req.querySelector('i').className = 'fas fa-check-circle';
          strength++;
        } else {
          req.classList.remove('valid');
          req.querySelector('i').className = 'fas fa-circle';
        }
      });

      const percentage = (strength / 5) * 100;
      strengthMeter.style.width = `${percentage}%`;
      strengthMeter.setAttribute('aria-valuenow', percentage);
      strengthMeter.style.background =
        percentage <= 20 ? '#f56565' :
        percentage <= 40 ? '#ed8936' :
        percentage <= 60 ? '#ecc94b' :
        percentage <= 80 ? '#48bb78' : '#38a169';

      strengthText.textContent =
        percentage <= 20 ? 'Very Weak' :
        percentage <= 40 ? 'Weak' :
        percentage <= 60 ? 'Medium' :
        percentage <= 80 ? 'Strong' : 'Very Strong';
    }

    newPassword.addEventListener('input', () => {
      checkPasswordStrength(newPassword.value);
    });

    document.getElementById('resetForm').addEventListener('submit', function (e) {
      if (newPassword.value !== confirmPassword.value) {
        e.preventDefault();
        alert('Passwords do not match!');
        return;
      }

      const btn = this.querySelector('button');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting Password...';
    });
  </script>
</body>
</html>
