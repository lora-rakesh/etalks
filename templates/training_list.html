{% for topic in topics %}
    <div class="col">
        <div class="card h-100 shadow-sm">
            <div class="card-body">
                <h5 class="card-title">{{ topic.title }}</h5>
                <p class="card-text text-muted small">
                    Date: {{ topic.created_at|date:"d M Y, H:i" }}
                </p>
                <p class="card-text">{{ topic.description|truncatechars:150 }}</p>

                <a href="{{ topic.topic_link }}" target="_blank" class="btn btn-primary">View Details</a>

            </div>
        </div>
    </div>
{% endfor %}
